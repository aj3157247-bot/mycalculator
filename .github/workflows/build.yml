name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK
        run: |
          set +e

          buildozer -v android debug 2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "      IMPORTANT ERROR LINES"
          echo "========================================"

          grep -Ein \
            "error|failed|fatal|exception|traceback|undefined reference|No such file|not found" \
            build.log | tail -150 || true

          echo ""
          echo "========================================"
          echo "      LAST 200 LOG LINES"
          echo "========================================"

          tail -200 build.log

          echo ""
          echo "Buildozer exit code: $BUILD_EXIT"

          exit $BUILD_EXIT

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: bin/*.apk
          if-no-files-found: error
