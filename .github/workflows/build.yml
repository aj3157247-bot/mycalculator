name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.6.0
          pip install cython==0.29.37

      - name: Check environment
        run: |
          echo "========== PYTHON =========="
          python --version

          echo "========== BUILDOZER =========="
          buildozer --version

          echo "========== JAVA =========="
          java -version

          echo "========== ANDROID =========="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

      - name: Clean old Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin
          mkdir -p bin

      - name: Build APK
        run: |
          set +e

          echo "========================================"
          echo "        STARTING BUILDOZER"
          echo "========================================"

          buildozer -v android debug 2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "        REAL ERROR SEARCH"
          echo "========================================"

          grep -Ein \
            "error:|error |failed|fatal|exception|traceback|undefined reference|no such file|not found|cannot|can't|unable|command failed" \
            build.log | tail -200 || true

          echo ""
          echo "========================================"
          echo "        LAST 300 LOG LINES"
          echo "========================================"

          tail -300 build.log

          echo ""
          echo "========================================"
          echo "        BUILDOZER EXIT CODE"
          echo "========================================"

          echo "$BUILD_EXIT"

          exit $BUILD_EXIT

      - name: Upload complete build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: bin/*.apk
          if-no-files-found: error
