name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build My Calculator
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            cmake

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.6.0
          python -m pip install Cython==0.29.34

      - name: Verify project
        run: |
          echo "=============================="
          echo "PROJECT FILES"
          echo "=============================="

          find . -maxdepth 2 -type f | sort

          echo ""
          echo "=============================="
          echo "BUILDOZER REQUIREMENTS"
          echo "=============================="

          grep -n "requirements" buildozer.spec

          echo ""
          echo "=============================="
          echo "SEARCHING FOR OLD KIVY"
          echo "=============================="

          grep -RIn "kivy==2.3.1" . \
            --exclude-dir=.git \
            --exclude-dir=.buildozer \
            --exclude=build.log || true

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        shell: bash
        run: |
          set +e

          buildozer -v android debug 2>&1 | tee build.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "BUILD EXIT CODE: $EXIT_CODE"
          echo "========================================"

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo "ERROR SUMMARY"
            echo "========================================"

            grep -Ein \
              "error:|error |failed|fatal|exception|traceback|undefined reference|no such file|not found|cannot|unable|command failed" \
              build.log | tail -200 || true

            echo ""
            echo "========================================"
            echo "LAST 200 LINES"
            echo "========================================"

            tail -200 build.log

          fi

          exit "$EXIT_CODE"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mycalculator-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
