name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Calculator APK
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev


      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel
          python -m pip install buildozer==1.6.0
          python -m pip install Cython==0.29.37


      - name: Check project
        run: |
          echo "========== PYTHON =========="
          python --version

          echo "========== BUILDOZER =========="
          buildozer --version

          echo "========== JAVA =========="
          java -version

          echo "========== PROJECT =========="
          ls -la

          echo "========== BUILDOZER SPEC =========="
          cat buildozer.spec

          echo "========== MAIN.PY =========="
          test -f main.py


      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin


      - name: Build APK
        shell: bash
        run: |
          set +e

          echo "======================================"
          echo "        STARTING APK BUILD"
          echo "======================================"

          buildozer -v android debug 2>&1 | tee build.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "======================================"
          echo "        BUILD EXIT CODE"
          echo "======================================"

          echo "$EXIT_CODE"

          echo ""
          echo "======================================"
          echo "        ERROR SUMMARY"
          echo "======================================"

          grep -Ein \
            "error:|error |failed|fatal|exception|traceback|undefined reference|no such file|not found|cannot|unable|command failed" \
            build.log | tail -200 || true

          echo ""
          echo "======================================"
          echo "        LAST 200 LINES"
          echo "======================================"

          tail -200 build.log

          exit "$EXIT_CODE"


      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore


      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mycalculator-apk
          path: bin/*.apk
          if-no-files-found: error
