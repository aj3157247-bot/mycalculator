name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Calculator APK
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------
      # 1. دریافت پروژه
      # --------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------
      # 2. نصب Python
      # --------------------------------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # --------------------------------
      # 3. نصب Java 17
      # --------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"


      # --------------------------------
      # 4. نصب وابستگی‌های Linux
      # --------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            cmake


      # --------------------------------
      # 5. نصب Buildozer
      # --------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel
          python -m pip install buildozer==1.6.0
          python -m pip install cython==0.29.37


      # --------------------------------
      # 6. بررسی محیط
      # --------------------------------
      - name: Check environment
        run: |
          echo "=============================="
          echo "Python"
          echo "=============================="
          python --version

          echo ""
          echo "=============================="
          echo "Buildozer"
          echo "=============================="
          buildozer --version

          echo ""
          echo "=============================="
          echo "Java"
          echo "=============================="
          java -version

          echo ""
          echo "=============================="
          echo "Project files"
          echo "=============================="
          ls -la

          echo ""
          echo "=============================="
          echo "buildozer.spec"
          echo "=============================="
          cat buildozer.spec


      # --------------------------------
      # 7. پاک کردن build قبلی
      # --------------------------------
      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin


      # --------------------------------
      # 8. ساخت APK
      # --------------------------------
      - name: Build APK
        shell: bash
        run: |
          set +e

          echo "======================================"
          echo "       STARTING BUILDOZER BUILD"
          echo "======================================"

          buildozer -v android debug > build.log 2>&1

          EXIT_CODE=$?

          echo ""
          echo "======================================"
          echo "       BUILDOZER FINISHED"
          echo "       EXIT CODE: $EXIT_CODE"
          echo "======================================"

          echo ""
          echo "======================================"
          echo "       IMPORTANT ERRORS"
          echo "======================================"

          grep -Ein \
            "error:|error |failed|fatal|exception|traceback|undefined reference|no such file|not found|cannot|unable|command failed" \
            build.log | tail -200 || true

          echo ""
          echo "======================================"
          echo "       LAST 300 LOG LINES"
          echo "======================================"

          tail -300 build.log

          exit $EXIT_CODE


      # --------------------------------
      # 9. ذخیره log حتی اگر build شکست خورد
      # --------------------------------
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore


      # --------------------------------
      # 10. ذخیره APK
      # --------------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mycalculator-apk
          path: bin/*.apk
          if-no-files-found: error
