name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            cmake

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.6.0
          python -m pip install Cython==0.29.37

      - name: Check project
        run: |
          test -f main.py
          test -f buildozer.spec

          echo "Python:"
          python --version

          echo "Buildozer:"
          buildozer --version

          echo "Requirements:"
          grep "^requirements" buildozer.spec

      - name: Check for invalid requirements
        run: |
          if grep -RInE \
            "requirements.*=.*(android|kivy==|charset_normalizer)" \
            . \
            --exclude-dir=.git \
            --exclude-dir=.buildozer \
            --exclude=build.log; then

            echo "Invalid requirement found."
            exit 1
          fi

      - name: Clean Build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        shell: bash
        run: |
          set +e

          buildozer -v android debug 2>&1 | tee build.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "=============================="
          echo "BUILD EXIT CODE: $EXIT_CODE"
          echo "=============================="

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo ""
            echo "=============================="
            echo "ERRORS"
            echo "=============================="

            grep -Ein \
              "error:|error |failed|fatal|exception|traceback|unsupported wheel|not a supported wheel|no matching distribution|could not find|command failed" \
              build.log | tail -200 || true

            echo ""
            echo "=============================="
            echo "LAST 200 LINES"
            echo "=============================="

            tail -200 build.log
          fi

          exit "$EXIT_CODE"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mycalculator-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
